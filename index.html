<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de convite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Leckerli+One&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <aside>
      <img class="background" src="assets/Background.png" alt="">
      <div class="aside-container">
        <header>
          <img class="logo-img" src="assets/Logo.svg" alt="">
          <h1 class="text-logo">Festivite</h1>
          <p>Crie um convite digital para o seu evento</p>
        </header>
      </div>
    </aside>
    <main>
      <div class="main-container">
        <h1>Crie seu convite</h1>
        <form method="post" enctype="multipart/form-data">
          <fieldset class="about-event">
            <div class="section-title">
              <img src="assets/icons/calendar.svg" alt="Ícone de calendário">
              <legend>Sobre o evento</legend>
            </div>
            <div class="grid">
              <div class="input-wrapper">
                <label for="title">Título</label>
                <input type="text" name="title" id="title" placeholder="Nome do evento">
              </div>
              <div class="grid-2">
                <div class="input-wrapper">
                  <label for="event-start">Início</label>
                  <input type="date" name="event-start" id="event-start">
                </div>
                <div class="input-wrapper">
                  <label for="event-end">Fim</label>
                  <input type="date" name="event-end" id="event-end">
                </div>
              </div>
              <div class="grid-2">
                <div class="radio-group" role="group">
                  <span>Tipo</span>
                  <div class="radio-wrapper">
                    <div class="radio-inner">
                      <input type="radio" name="type-event" value="in-person" id="in-person" checked>
                      <div class="radio-image in-person"></div>
                      <span>Presencial</span>
                    </div>
                  </div>
                  <div class="radio-wrapper">
                    <div class="radio-inner online">
                      <input type="radio" name="type-event" value="online" id="online" aria-label="Online">
                      <div class="radio-image online"></div>
                      <span>Online</span>
                    </div>
                  </div>
                </div>
                <div class="input-wrapper">
                  <label for="local">Local</label>
                  <input type="text" name="local" id="local">
                </div>
              </div>
              <div class="textarea-wrapper">
                <label for="description">Descrição</label>
                <textarea name="description" id="description" cols="30" rows="5" placeholder="Escreva sobre os detalhes do evento"></textarea>
              </div>
            </div>
          </fieldset>
          <fieldset class="personalization grid">
            <div class="section-title">
              <img src="assets/icons/paintbrush-vertical.svg" alt="Ícone de pincel">
              <legend>Personalização</legend>
            </div>
            <div class="color-selector">
              <label for="color">Cor principal</label>
              <div class="color-wrapper">
                <div class="color-picker">
                  <input type="radio" name="color" id="color" style="background-color: var(--brand-light);" checked>
                </div>
                <div class="color-picker">
                  <input type="radio" name="color" id="color" style="background-color: var(--navy);">
                </div>
                <div class="color-picker">
                  <input type="radio" name="color" id="color" style="background-color: var(--purple);">
                </div>
                <div class="color-picker">
                  <input type="radio" name="color" id="color" style="background-color: var(--fuschia);">
                </div>
                <div class="color-picker">
                  <input type="radio" name="color" id="color" style="background-color: var(--pink);">
                </div>
                <div class="color-picker">
                  <input type="radio" name="color" id="color" style="background-color: var(--danger);">
                </div>
                <div class="color-picker">
                  <input type="radio" name="color" id="color" style="background-color: var(--orange);">
                </div>
                <div class="color-picker">
                  <input type="radio" name="color" id="color" style="background-color: var(--yellow);">
                </div>
                <div class="color-picker">
                  <input type="radio" name="color" id="color" style="background-color: var(--lime);">
                </div>
                <div class="color-picker">
                  <input type="radio" name="color" id="color" style="background-color: var(--green);">
                </div>
                <div class="color-picker">
                  <input type="radio" name="color" id="color" style="background-color: var(--cyan);">
                </div>
              </div>
            </div>
            <div class="theme-selector">
              <div class="input-wrapper">
                <label>Tema do evento</label>
                <div class="theme-wrapper">
                  <div class="theme-inner">
                    <input type="radio" name="theme-selection" id="birthday" value="birthday">
                    <img src="assets/images/birthday.jpg" alt="Imagem de aniversário">
                    <label for="birthday">Aniversário</label>
                  </div>
                  <div class="theme-inner">
                    <input type="radio" name="theme-selection" id="childish" value="childish">
                    <img src="assets/images/childish.jpg" alt="Imagem infantil">
                    <label for="childish">Infantil</label>
                  </div>
                  <div class="theme-inner">
                    <input type="radio" name="theme-selection" id="graduation" value="graduation">
                    <img src="assets/images/graduation.jpg" alt="Imagem de formatura">
                    <label for="graduation">Formatura</label>
                  </div>
                  <div class="theme-inner">
                    <input type="radio" name="theme-selection" id="marriage" value="marriage">
                    <img src="assets/images/marriage.jpg" alt="Imagem de casamento">
                    <label for="marriage">Casamento</label>
                  </div>
                  <div class="theme-inner">
                    <input type="radio" name="theme-selection" id="baby-shower" value="baby-shower">
                    <img src="assets/images/baby-shower.jpg" alt="Imagem de chá de bebê">
                    <label for="baby-shower">Chá de bebê</label>
                  </div>
                  <div class="theme-inner">
                    <input type="radio" name="theme-selection" id="bridal-shower" value="bridal-shower">
                    <img src="assets/images/bridal-shower.jpg" alt="Imagem de chá de panela">
                    <label for="bridal-shower">Chá de panela</label>
                  </div>
                  <div class="theme-inner">
                    <input type="radio" name="theme-selection" id="carnival" value="carnival">
                    <img src="assets/images/carnival.jpg" alt="Imagem de carnaval">
                    <label for="carnival">Carnaval</label>
                  </div>
                  <div class="theme-inner">
                    <input type="radio" name="theme-selection" id="easter" value="easter">
                    <img src="assets/images/easter.jpg" alt="Imagem de páscoa">
                    <label for="easter">Páscoa</label>
                  </div>
                  <div class="theme-inner">
                    <input type="radio" name="theme-selection" id="saint-john" value="saint-john">
                    <img src="assets/images/saint-john.jpg" alt="Imagem de São João">
                    <label for="saint-john">São João</label>
                  </div>
                  <div class="theme-inner">
                    <input type="radio" name="theme-selection" id="halloween" value="halloween">
                    <img src="assets/images/halloween.jpg" alt="Imagem de halloween">
                    <label for="halloween">Halloween</label>
                  </div>
                  <div class="theme-inner">
                    <input type="radio" name="theme-selection" id="christmas" value="christmas">
                    <img src="assets/images/christmas.jpg" alt="Imagem natal">
                    <label for="christmas">Natal</label>
                  </div>
                  <div class="theme-inner">
                    <input type="radio" name="theme-selection" id="other" value="other">
                    <img src="assets/images/other.jpg" alt="Imagem de pessoas brindando juntas">
                    <label for="other">Outras</label>
                  </div>
                </div>
              </div>
            </div>
            <div class="style-selector">
              <label>Estilo</label>
              <div class="input-wrapper">
                <label class="switch-wrapper">
                  <input type="checkbox">
                  <span class="slider"></span>
                </label>
                <span class="switch-text"></span>
              </div>
            </div>
          </fieldset>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
